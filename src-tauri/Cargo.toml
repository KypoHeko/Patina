[package]
name = "patina"
version = "0.1.0"
edition = "2024"
description = "Patina — file manager for power users"

# Имя библиотеки отличается от бинарника, иначе на Windows конфликт имён.
[lib]
name = "patina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
