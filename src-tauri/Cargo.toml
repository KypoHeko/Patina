[package]
name = "patina"
version = "0.1.0"
edition = "2024"
description = "Patina — file manager for power users"

[lib]
name = "patina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
open = "5"
trash = "5"
fs_extra = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
blake3 = "1"
sysinfo = "0.33"
image = "0.25"
notify = "6"
